#---------------------------------------------------------------#
#---------------OIDC AUTHENTICATION CONFIGURATIONS--------------#
#---------------------------------------------------------------#
#        Configuration properties used by the CAS OIDC          #
#          Authentication plugin, when it is enabled.           #
#---------------------------------------------------------------#

# The Realm on the OIDC server we should use for authentication
authentication-oidc.auth-server-realm =

# The Base URL of all OIDC server endpoints
authentication-oidc.auth-server-url =

# The URL of the Token endpoint
authentication-oidc.token-endpoint = ${authentication-oidc.auth-server-url}/auth/realms/${authentication-oidc.auth-server-realm}/protocol/openid-connect/token

# The URL of the Authorize endpoint
authentication-oidc.authorize-endpoint = ${authentication-oidc.auth-server-url}/auth/realms/${authentication-oidc.auth-server-realm}/protocol/openid-connect/auth

# The URL of the Introspect endpoint
authentication-oidc.user-info-endpoint = ${authentication-oidc.auth-server-url}/auth/realms/${authentication-oidc.auth-server-realm}/protocol/openid-connect/userinfo

# The registered client id
authentication-oidc.client-id =

# The registered client secret
authentication-oidc.client-secret =

# The redirect url
authentication-oidc.redirect-url = ${dspace.server.url}/api/authn/oidc

# The scopes to request
authentication-oidc.scopes = openid,email,profile

# Specify if the user can self register using OIDC (true|false). If not specified, true is assumed
# This should match the configuration of the OIDC server you are using. The default setting for
# Keycloak is true. Do set it to false if your OIDC server disallows self-registration. Otherwise,
# leave this set to true.
authentication-oidc.can-self-register = true

#Specify the attribute present in the user info json related to the user's email
authentication-oidc.user-info.email = email

#Specify the attribute present in the user info json related to the user's first name
authentication-oidc.user-info.first-name = given_name

#Specify the attribute present in the user info json related to the user's last name
authentication-oidc.user-info.last-name = family_name

### Properties used by CLARIN extension of the OIDC authentication ###

# The CLARIN extension is a separate authentication plugin, enabled instead of the stock OidcAuthentication
# (see authentication.cfg; restart after changing the plugin sequence):
#plugin.sequence.org.dspace.authenticate.AuthenticationMethod = org.dspace.authenticate.clarin.ClarinOidcAuthentication
# The CLARIN extension identifies users by a stable provider user ID (the "sub" claim) stored in the
# authentication_identity table instead of by email, requires a verified email before linking an identity to
# an existing EPerson found by email, and supports mapping OIDC groups/roles and a default authentication
# group (see authentication-oidc.user-info.groups, authentication-oidc.group.<value> and
# authentication-oidc.default.auth.group below).

#Specify the attribute present in the user info json related to the user's unique ID
authentication-oidc.user-info.id = sub

# Specify the attribute present in the user info json confirming the user's email is verified, "email_verified"
# by default, as defined by the OIDC standard claims.
authentication-oidc.user-info.email-verified = email_verified

# Whether the email must be confirmed verified (see authentication-oidc.user-info.email-verified above) before
# an OIDC identity is linked to an existing EPerson found by email (e.g. one created by Shibboleth). Enabled by
# default: without it, any OIDC provider that doesn't actually verify a claimed email (or a user who can set
# their own email at the provider) could take over an existing account, including an administrator's.
# Only disable this for a specific deployment if its OIDC provider is known not to emit this claim at all
# (e.g. per https://aai.cesnet.cz/en/index/documentation/sp/proxy/attributes_and_scopes, CESNET's OIDC
# provider does not emit "email_verified") and you accept that any claimed email will be trusted without
# verification for that provider.
authentication-oidc.require-verified-email = true

# Specify the attribute present in the user info json related to the user's organization, not set by
# default. When set, the CLARIN user registration of the EPerson is created/updated with this value.
# This claim may be returned as a JSON array of multiple affiliations (e.g. "voperson_external_affiliation" =
# [affiliate@einfra.cesnet.cz, affiliate@google.extidp.cesnet.cz]), or as a single comma-separated string;
# in both cases, only the first value is stored.
#authentication-oidc.user-info.organization = voperson_external_affiliation

# Stable label of the OIDC provider, stored with the user's unique ID in the authentication_identity table.
# Users are found by the (provider, user ID) pair, so this value must NOT be changed after users have logged in.
# When not set (recommended), the CLARIN OIDC extension uses the verified issuer ("iss") of the ID token, so
# identities of different providers can never collide.
# Example:
#authentication-oidc.provider = cesnet

# The OIDC provider's issuer identifier. Required by the CLARIN OIDC extension, which loads all provider
# endpoints (authorization, token, UserInfo, JWKS) from OIDC discovery
# (<issuer>/.well-known/openid-configuration), so the *-endpoint properties above are not used by it.
# It must be exactly the "issuer" value of the discovery document (mind the trailing slash), e.g.
#authentication-oidc.issuer = https://login.e-infra.cz/oidc/

# The CLARIN OIDC extension runs on Spring Security's oauth2Login(): ID tokens must be signed with RS256
# (Spring's default, any other algorithm incl. "none" is rejected), and the pending login (state, nonce, PKCE
# verifier) is kept in an HTTP session (JSESSIONID cookie) between the start of the login and the redirect back
# from the provider; the session is invalidated when the login ends. With more than one backend replica the
# load balancer must route both requests to the same replica (sticky sessions).
# The redirect URL to register at the provider is ${dspace.server.url}/api/authn/oidc/callback/clarin-oidc
# (authentication-oidc.redirect-url above is only used by the stock plugin).

# Connect and read timeout (milliseconds) of the token and UserInfo calls (CLARIN OIDC extension).
#authentication-oidc.http.timeout = 10000

# How the CLARIN OIDC extension authenticates to the token endpoint: client_secret_post (default, as the stock
# OIDC plugin does) or client_secret_basic.
#authentication-oidc.token-endpoint-auth-method = client_secret_post

# Specify the attribute present in the user info json related to the user's (external) groups, not set by
# default. Group mapping below is disabled unless this is configured. The claim may be a single string or
# a JSON array of strings, e.g. "eduperson_entitlement" returning values such as
# "urn:geant:cesnet.cz:group:einfra#Perun Identity and Management System - Maintenance"
# (see https://perunaai.atlassian.net/wiki/spaces/EINFRACZ/pages/9011201/Attributes+and+scopes).
#authentication-oidc.user-info.groups = eduperson_entitlement

# Map a group value returned by the OIDC provider to one or more DSpace groups (comma separated DSpace
# group names, case sensitive). The user is placed into these groups as 'special groups' for the
# duration of their session, similarly to authentication-shibboleth.role.<affiliation> mappings.
# If the group value is a URN with an authority suffix after '#' (as with AARC-style
# eduPersonEntitlement values, see authentication-oidc.user-info.groups above), that suffix is
# stripped before the lookup. Colons in the group value must be escaped with a backslash, as for any
# DSpace configuration property key.
# authentication-oidc.group.<group value as returned by the provider, without the authority suffix> = Group1, Group2
#authentication-oidc.group.staff = Staff, Member
#authentication-oidc.group.student = Students, Member
#authentication-oidc.group.urn\:geant\:cesnet.cz\:group\:einfra = eInfra Users
#authentication-oidc.group.urn\:geant\:cesnet.cz\:group\:einfra\:members = eInfra Members

# Default DSpace group (special group) every OIDC authenticated user is placed into, regardless of their
# groups, similarly to authentication-shibboleth.default.auth.group. Not set by default.
#authentication-oidc.default.auth.group = Authenticated

# For the CLARIN OIDC extension, you may need to overwrite the authentication-oidc.scopes property
# to the values required by the specific OIDC provider.
# (for the CESNET e-infra OIDC scopes, see https://aai.cesnet.cz/en/index/documentation/sp/proxy/attributes_and_scopes)
#authentication-oidc.scopes = openid,email,profile,eduperson_entitlement,voperson_external_affiliation
